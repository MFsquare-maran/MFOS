; PlatformIO Project Configuration File
;
; Zwei Environments: MFOS_test (src/TEST/) und MFOS_Main (src/MAIN/)
; Gemeinsame Einstellungen stehen in [common] und werden via 'extends' geerbt.
; https://docs.platformio.org/page/projectconf.html

[common]
; pioarduino-Fork -> liefert Arduino-Core 3.x (ledcAttach/ledcWrite).
; 'stable' zeigt immer auf den aktuellen 3.x-Release (keine Version pflegen).
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit ADS1X15
    adafruit/Adafruit Unified Sensor
    sparkfun/SparkFun LSM9DS1 IMU
    robtillaart/INA226
    mikalhart/TinyGPSPlus


[env:MFOS_test]
extends = common
build_src_filter =
    -<*>
    +<TEST/>


[env:MFOS_Main]
extends = common
build_src_filter =
    -<*>
    +<MAIN/>
