# MFOS Server: Mosquitto (MQTT) und Web-Server mit Passwortschutz, HINTER einem Reverse Proxy.
#
# TLS (Zertifikate, HTTPS) macht der vorgeschaltete Reverse Proxy, nicht dieser Stack.
# Der Proxy laeuft auf einem ANDEREN Server und erreicht die Dienste ueber das lokale Netz:
# WEB_BIND und MQTT_BIND sind die LAN-Adresse DIESES Servers. Die Ports duerfen nur dem Proxy
# offenstehen (Firewall) und NIE aus dem Internet erreichbar sein, denn hier gibt es kein TLS.
#
# Gedacht fuer Portainer (Stack aus dem Git-Repository), geht aber auch mit
#   docker compose --env-file .env up -d --build
# Alle Einstellungen kommen aus Umgebungsvariablen (siehe .env.example).
# Es stehen KEINE Passwoerter in dieser Datei.

name: mfos

# Gemeinsame Haertung fuer alle Container
x-hardening: &hardening
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 200
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # Einmal-Job: legt den Datenordner auf dem Server an und gibt ihn dem Broker (Benutzer 1883).
  # Alle dauerhaften Daten liegen in DATA_DIR, nicht in Docker-Volumes.
  init:
    <<: *hardening
    restart: "no"
    image: alpine:3
    container_name: mfos-init
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/mosquitto && chown 1883:1883 /data/mosquitto && chmod 0700 /data/mosquitto"]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - ${DATA_DIR:-/serverdata/server/mfos-dashboard}:/data
    mem_limit: 32m

  # MQTT-Broker: Anmeldung Pflicht, Rechte pro Boot. Spricht Klartext (TLS macht der Proxy).
  mosquitto:
    <<: *hardening
    build:
      context: ./mosquitto
      # Basis-Bild bei jedem Bau neu pruefen (Sicherheits-Updates)
      pull: true
    # Immer neu bauen, wenn der Stack gestartet oder aktualisiert wird
    pull_policy: build
    image: mfos-mosquitto:local
    container_name: mfos-mosquitto
    user: "1883:1883"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      MQTT_BOAT_USER: ${MQTT_BOAT_USER:-mfos-1}
      MQTT_BOAT_PASSWORD: ${MQTT_BOAT_PASSWORD:?MQTT_BOAT_PASSWORD fehlt}
      MQTT_BACKEND_USER: ${MQTT_BACKEND_USER:-mfos-backend}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?MQTT_BACKEND_PASSWORD fehlt}
      MQTT_WEBSOCKETS: ${MQTT_WEBSOCKETS:-false}
    ports:
      # Nur an der LAN-Adresse dieses Servers. NIEMALS 0.0.0.0 und nie eine Internet-Adresse:
      # Auf diesem Port gibt es kein TLS, Passwoerter gingen im Klartext durchs Netz.
      - "${MQTT_BIND:?MQTT_BIND fehlt (LAN-Adresse dieses Servers, z. B. 192.168.1.20, nie 0.0.0.0)}:${MQTT_PORT:-1883}:1883"
    tmpfs:
      - /run/mosquitto:uid=1883,gid=1883,mode=0700,size=2m,noexec,nosuid
      - /tmp:uid=1883,gid=1883,mode=1777,size=8m,noexec,nosuid
    volumes:
      # Gespeicherte Nachrichten und Sitzungen des Brokers (keine Passwoerter) im Datenordner auf dem Server
      - ${DATA_DIR:-/serverdata/server/mfos-dashboard}/mosquitto:/mosquitto/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u mfos-health -P \"$$(cat /run/mosquitto/health.pass)\" -t mfos/_health -m ok -q 1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Web-Server: Passwortschutz, Sicherheits-Header, Dashboard; optional MQTT ueber WebSocket unter /mqtt
  web:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      # Basis-Bild bei jedem Bau neu pruefen (Sicherheits-Updates)
      pull: true
    # Immer neu bauen, wenn der Stack gestartet oder aktualisiert wird
    pull_policy: build
    image: mfos-web:local
    container_name: mfos-web
    user: "10001:10001"
    depends_on:
      - mosquitto
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER:?DASHBOARD_USER fehlt}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD fehlt}
    ports:
      # Nur an der LAN-Adresse dieses Servers, fuer den Proxy. Nie 0.0.0.0 (kein TLS auf diesem Port).
      - "${WEB_BIND:?WEB_BIND fehlt (LAN-Adresse dieses Servers, z. B. 192.168.1.20, nie 0.0.0.0)}:${WEB_PORT:-8080}:8080"
    tmpfs:
      # Gehoeren dem Benutzer des Containers (10001), sonst kann Caddy dort nichts anlegen
      - /tmp:uid=10001,gid=10001,mode=1777,size=16m,noexec,nosuid
      - /data:uid=10001,gid=10001,mode=0700,size=8m,noexec,nosuid
      - /config:uid=10001,gid=10001,mode=0700,size=8m,noexec,nosuid
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
